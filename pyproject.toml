[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vja"
version = "6.0.3"
description = "A simple CLI for Vikunja task manager"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "ce72" }
]
license = "GPL-3.0-or-later"
license-files = [ "LICENSE" ]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "click>=8.1",
  "click-aliases>=1.0.7",
  "requests>=2.32",
  "parsedatetime>=2.6",
  "python-dateutil>=2.8",
  "PyJWT>=2.8",
]

[project.scripts]
vja = "vja.cli:cli"

[project.urls]
Homepage = "https://gitlab.com/ce72/vja"
Repository = "https://gitlab.com/ce72/vja.git"
Issues = "https://gitlab.com/ce72/vja/-/issues"
Changelog = "https://gitlab.com/ce72/vja/-/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["vja*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific rules
]
ignore = [
  "B007",   # loop variable 'x' — used inside eval() template strings, invisible to ruff
  "B904",   # raise ... from — catch_exception intentionally flattens the chain for CLI output
  "E501",   # line too long — enforced via line-length, not per-line
  "RUF012", # mutable class attr — _arg_to_json is a constant lookup table, never mutated
  "SIM105", # contextlib.suppress — try/except/pass is clearer when the intent needs a comment
  "SIM108", # ternary instead of if-else — often less readable
]

[tool.ruff.lint.isort]
known-first-party = ["vja"]

