#variables:
#  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
#cache:
#  paths:
#    - .cache/pip

stages:
  - test
  - release

.start_vikunja: &start_vikunja
  - apk add --no-cache bash curl python3 py3-pip
  - python3 --version

  - python3 -m venv ./venv
  - . ./venv/bin/activate
  - python3 -m pip install -r requirements_dev.txt
  - python3 -m pip install .
  - vja --version

  - mkdir -p $PWD/files
  - chmod a+w $PWD/files
  - docker compose -f tests/docker-compose.yml pull vikunja
  - docker compose -f tests/docker-compose.yml up -d
  - sleep 1s
  - curl --retry 5 --retry-all-errors --retry-delay 1 "http://docker:3456/api/v2/info"

old-python-versions:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  allow_failure: true
  parallel:
    matrix:
      - PYTHON_VERSION: [ "3.12", "3.13" ]
  script:
    - python3 -m venv ./venv
    - . ./venv/bin/activate
    - python3 -m pip install -r requirements_dev.txt
    - python3 -m pip install .
    - vja --version

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "beta" || $CI_COMMIT_BRANCH == "rc"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_SLUG !~ /renovate.*/
      when: manual

lint:
  stage: test
  image: python:3.14-slim
  allow_failure: true
  script:
    - python3 -m venv ./venv
    - . ./venv/bin/activate
    - python3 -m pip install -r requirements_dev.txt
    - python3 -m pip install .
    - vja --version

    - ruff format --check || true
    - ruff check vja
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "beta" || $CI_COMMIT_BRANCH == "rc"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_SLUG !~ /renovate.*/
      when: manual

integration-test-prod:
  stage: test
  image:
    name: docker:cli
  services:
    - name: docker:dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  script:
    - *start_vikunja
    - export VJA_CONFIGDIR=tests/.vjatest_dind
    - coverage run --omit='*test*' -m pytest
    - coverage report --omit='*test*'
    - coverage xml --omit='*test*'
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "beta" || $CI_COMMIT_BRANCH == "rc"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_SLUG !~ /renovate.*/
      when: manual

integration-test-unstable:
  stage: test
  image:
    name: docker:cli
  services:
    - name: docker:dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    VIKUNJA_IMAGE: vikunja/vikunja:unstable
  allow_failure: true
  script:
    - *start_vikunja
    - export VJA_CONFIGDIR=tests/.vjatest_dind
    - pytest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "beta" || $CI_COMMIT_BRANCH == "rc"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_SLUG !~ /renovate.*/
      when: manual

release:
  resource_group: semantic-release
  image: node:lts-slim
  stage: release
  variables:
    PYPI_USERNAME: __token__
    PYPI_TOKEN: ${PYPI_VJA_TOKEN}
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git-core ca-certificates python3-full python-is-python3 twine
    - python3 --version
    - npm install -g semantic-release @semantic-release/gitlab @semantic-release/changelog conventional-changelog-conventionalcommits@9 @semantic-release/commit-analyzer @semantic-release/git semantic-release-pypi
  script:
    - semantic-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "beta" || $CI_COMMIT_BRANCH == "rc"
      when: manual

